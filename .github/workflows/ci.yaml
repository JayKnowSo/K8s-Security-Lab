# CI PIPELINE - K8s Security Lab
# Stage 1: Validate Kubernetes manifests against upstream schemas (offline)
# Stage 2: Trivy misconfiguration scan on all YAML manifests
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kubeconform -strict -summary \
            namespaces.yaml \
            rbac.yaml \
            networkpolicy.yaml \
            compliant-pod.yaml

  trivy-misconfig:
    name: Trivy Misconfiguration Scan
    runs-on: ubuntu-latest
    needs: validate-manifests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          skip-dirs: .github
