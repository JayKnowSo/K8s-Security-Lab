# CI PIPELINE - K8s Security Lab
# Stage 1: Validate Kubernetes manifests against upstream schemas (offline)
# Stage 2: Trivy misconfiguration scan on all YAML manifests
#
# SECURITY: All actions and binaries pinned to immutable versions
# Prevents supply chain attacks — trivy-action was compromised March 19 2026
# actions/checkout: v4.2.2
# aquasecurity/trivy-action: v0.35.0 (immutable release, unaffected by March 2026 attack)
# kubeconform: v0.6.7 (pinned binary version, no floating latest)

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c
          tar xz -C /tmp -f /tmp/kubeconform.tar.gz
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: Validate manifests
        run: |
          kubeconform -strict -summary \
            namespaces.yaml \
            rbac.yaml \
            networkpolicy.yaml \
            compliant-pod.yaml

  trivy-misconfig:
    name: Trivy Misconfiguration Scan
    runs-on: ubuntu-latest
    needs: validate-manifests
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          skip-dirs: .github

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: trivy-misconfig
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: "nginxinc/nginx-unprivileged@sha256:a0f9dc41789992dae4dce1ed4db44f0ad662012c5cfced9751e9177a84081958"
          format: cyclonedx
          output: sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
