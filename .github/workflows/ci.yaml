# CI PIPELINE - K8s Security Lab
# Validates all Kubernetes manifests against upstream schemas on every push
# No live cluster required — kubeconform validates offline against k8s API schemas

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kubeconform -strict -summary \
            namespaces.yaml \
            rbac.yaml \
            networkpolicy.yaml \
            compliant-pod.yaml
