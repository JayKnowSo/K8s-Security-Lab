# COMPLIANT POD - production namespace
# Purpose: example of a fully secured pod meeting all security requirements
# Labels: used by NetworkPolicy allow-app-traffic to permit controlled traffic
# ServiceAccount: uses least-privilege production-app identity, not default
# SecurityContext: enforces non-root, no privilege escalation, dropped capabilities
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: production
  labels:
    app: compliant-pod
spec:
  serviceAccountName: production-app
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: compliant-pod
    image: nginxinc/nginx-unprivileged@sha256:a0f9dc41789992dae4dce1ed4db44f0ad662012c5cfced9751e9177a84081958 # alpine
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
