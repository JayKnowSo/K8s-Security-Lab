# NETWORK POLICIES - production namespace
# Purpose: enforce zero-trust networking - deny all traffic by default, then explicitly allow only what is necessary

---
# POLICY 1: Default Deny All
# Targets every pod in production (empty podSelector = all pods)
# Blocks all inbound (ingress) and outbound (egress) traffic by default
# Nothing communicates unless explicitly allowed by a second policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# POLICY 2: Allow App Traffic
# Targets only pods labeled app=compliant-pod
# Allows ingress and egress only within the production namespace
# Any pod without this label stays fully blocked by policy 1
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-traffic
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: compliant-pod
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          env: production
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          env: production
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
